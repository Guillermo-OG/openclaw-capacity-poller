name: OCI ARM Capacity Poller

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-poll
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # poll-us removed 2026-05-18 — US VM already landed (129.213.40.113).
  # Re-add by restoring the job block from git history if a second US tenancy is added.

  poll-br:
    name: Poll sa-vinhedo-1 (reserve for app#2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Poll capacity (BR)
        env:
          OCI_USER_OCID: ${{ secrets.BR_OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.BR_OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.BR_OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.BR_OCI_COMPARTMENT_OCID }}
          OCI_REGION: ${{ secrets.BR_OCI_REGION }}
          OCI_SUBNET_OCID: ${{ secrets.BR_OCI_SUBNET_OCID }}
          OCI_PRIVATE_KEY_PEM: ${{ secrets.BR_OCI_PRIVATE_KEY_PEM }}
          SSH_PUBLIC_KEY: ${{ secrets.BR_SSH_PUBLIC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          INSTANCE_NAME: openclaw-app2-br
        run: python poll_capacity.py

      - name: Upload capacity flag artifact (BR)
        if: hashFiles('capacity_found.flag') != ''
        uses: actions/upload-artifact@v4
        with:
          name: capacity_found_br
          path: capacity_found.flag
          retention-days: 30

      - name: Disable workflow on success (BR)
        if: hashFiles('capacity_found.flag') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/poll.yml/disable"
          echo "workflow disabled — BR instance created."
